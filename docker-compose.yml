version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: agro_postgres
    environment:
      POSTGRES_DB: agro_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: agro_api
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: agro_db
      DB_USER: postgres
      DB_PASS: postgres

volumes:
  postgres_data: